<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>錯題分析 — Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
    --green:#2f9e5c; --green-soft:#dcf3e6;
    --shadow: 0 2px 10px rgba(58,43,46,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:430px; margin:0 auto; padding:20px 20px 40px;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; margin-bottom:20px;}
  h1{font-size:1.3rem; margin:0 0 4px; font-weight:800;}
  .sub{font-size:.85rem; color:var(--muted); margin:0 0 20px; line-height:1.55;}

  .summary{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;}
  .stat{background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); text-align:center;}
  .stat-num{font-size:1.6rem; font-weight:800; color:var(--pink-ink);}
  .stat-label{font-size:.75rem; color:var(--muted); margin-top:2px;}

  .section-title{font-size:1.05rem; font-weight:800; margin:0 0 12px;}

  .weak-list{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
  .weak-chip{background:var(--yellow-soft); color:var(--ink); font-size:.8rem; font-weight:700; padding:9px 14px; border-radius:16px; display:flex; align-items:center; gap:6px;}
  .weak-chip .count{background:var(--yellow); color:var(--ink); font-size:.7rem; font-weight:800; padding:1px 7px; border-radius:10px;}

  .group-header{font-size:.78rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:16px 0 8px;}
  .group-header:first-child{margin-top:0;}
  .history-item{background:var(--card); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
  .history-top{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .history-date{font-size:.78rem; color:var(--muted);}
  .history-score{font-weight:800; font-size:.95rem;}
  .history-weak{font-size:.75rem; color:var(--muted); margin-top:4px;}
  .history-detail{display:none; margin-top:12px; padding-top:12px; border-top:1px solid rgba(58,43,46,0.06);}
  .history-detail.open{display:block;}
  .detail-item{display:flex; gap:8px; padding:6px 0; font-size:.82rem;}
  .detail-mark{flex-shrink:0; font-weight:800;}
  .detail-mark.ok{color:var(--green);}
  .detail-mark.no{color:var(--pink-ink);}
  .detail-mark.unsure{color:#a9821f;}

  .empty{background:var(--card); border-radius:18px; padding:32px 20px; text-align:center; box-shadow:var(--shadow);}
  .empty-icon{width:52px; height:52px; border-radius:16px; background:var(--pink-soft); color:var(--pink-ink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
  .empty p{font-size:.85rem; color:var(--muted); line-height:1.6; margin:0 0 18px;}
  .empty a{display:inline-block; background:var(--pink); color:#ffffff; text-decoration:none; font-weight:800;
    font-size:.85rem; padding:12px 22px; border-radius:16px; box-shadow:var(--shadow);}

  @media (min-width: 760px){ .page{max-width:820px;} }
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回首頁
    </a>
    <h1>錯題分析</h1>
    <p class="sub">整合每次批改的結果，找出小朋友最需要加強的地方。</p>

    <div id="content"></div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function parseScore(score) {
      const m = /^(\d+)\s*\/\s*(\d+)/.exec(score || '');
      if (!m) return null;
      return { correct: Number(m[1]), total: Number(m[2]) };
    }

    let history = [];
    try {
      history = JSON.parse(localStorage.getItem('hk_maths_grading_history') || '[]');
    } catch (e) {}

    const content = document.getElementById('content');

    if (!history.length) {
      content.innerHTML = `
        <div class="empty">
          <div class="empty-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l2 2 4-4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke-width="2.4"/></svg>
          </div>
          <p>暫時未有批改紀錄。<br>完成第一次批改後，這裡會顯示重點弱項與歷史紀錄。</p>
          <a href="upload.html">前往批改試卷</a>
        </div>
      `;
    } else {
      let totalCorrect = 0, totalCount = 0;
      const weakTally = {};
      history.forEach(h => {
        const s = parseScore(h.score);
        if (s) { totalCorrect += s.correct; totalCount += s.total; }
        (h.weakAreas || []).forEach(w => { weakTally[w] = (weakTally[w] || 0) + 1; });
      });
      const accuracy = totalCount ? Math.round((totalCorrect / totalCount) * 100) : null;
      const topWeak = Object.entries(weakTally).sort((a, b) => b[1] - a[1]).slice(0, 8);

      let html = `
        <div class="summary">
          <div class="stat"><div class="stat-num">${history.length}</div><div class="stat-label">已批改次數</div></div>
          <div class="stat"><div class="stat-num">${accuracy === null ? '—' : accuracy + '%'}</div><div class="stat-label">整體準確率</div></div>
        </div>
      `;

      if (topWeak.length) {
        html += `<div class="section-title">重點弱項</div><div class="weak-list">`;
        html += topWeak.map(([w, c]) => `<span class="weak-chip">${escapeHtml(w)}<span class="count">${c}</span></span>`).join('');
        html += `</div>`;
      }

      // Group into 本星期/上星期/由月份 so a long history doesn't read as one
      // undifferentiated wall of cards.
      function groupLabel(ts) {
        const days = Math.floor((Date.now() - ts) / 86400000);
        if (days < 7) return '本星期';
        if (days < 14) return '上星期';
        const d = new Date(ts);
        const now = new Date();
        return d.getFullYear() === now.getFullYear() ? `${d.getMonth() + 1}月` : `${d.getFullYear()}年${d.getMonth() + 1}月`;
      }
      let lastGroup = null;

      html += `<div class="section-title">批改紀錄</div>`;
      html += history.map((h, i) => {
        const marks = { true: ['✓','ok'], false: ['✗','no'], null: ['?','unsure'] };
        const details = (h.results || []).map(r => {
          const key = r.correct === true ? 'true' : r.correct === false ? 'false' : 'null';
          const [sym, cls] = marks[key];
          return `<div class="detail-item"><span class="detail-mark ${cls}">${sym}</span>
            <span><b>${escapeHtml(String(r.question || ''))}.</b> ${escapeHtml(r.studentAnswer || '')}
            ${r.note ? '<br><span style="color:var(--muted)">' + escapeHtml(r.note) + '</span>' : ''}</span></div>`;
        }).join('');
        const group = groupLabel(h.date);
        const groupHeader = group !== lastGroup ? `<div class="group-header">${group}</div>` : '';
        lastGroup = group;
        return `
          ${groupHeader}
          <div class="history-item">
            <div class="history-top" data-i="${i}">
              <div>
                <div class="history-date">${formatDate(h.date)}</div>
                ${h.weakAreas && h.weakAreas.length ? `<div class="history-weak">${h.weakAreas.map(escapeHtml).join('、')}</div>` : ''}
              </div>
              <div class="history-score">${escapeHtml(h.score || '')}</div>
            </div>
            <div class="history-detail${i === 0 ? ' open' : ''}" id="detail-${i}">${details || '<span style="color:var(--muted); font-size:.8rem;">沒有詳細紀錄</span>'}</div>
          </div>
        `;
      }).join('');

      content.innerHTML = html;

      content.querySelectorAll('.history-top').forEach(el => {
        el.addEventListener('click', () => {
          document.getElementById(`detail-${el.dataset.i}`).classList.toggle('open');
        });
      });
    }
  </script>
</body>
</html>
