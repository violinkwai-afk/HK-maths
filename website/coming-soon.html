<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小學習家</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
  :root{ --primary:#f5a9b8; --primary-ink:#c25c72; --primary-soft:#fdecef; --bg:#fffdfc; --text:#26364d; --muted:#8b96a6; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans TC",system-ui,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .box{max-width:360px; text-align:center;}
  .icon{width:56px; height:56px; border-radius:16px; background:var(--primary-soft); color:var(--primary-ink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
  h1{font-size:1.1rem; margin:0 0 8px;}
  p{font-size:.85rem; color:var(--muted); line-height:1.6; margin:0 0 20px;}
  a{display:inline-block; background:var(--primary); color:var(--text); text-decoration:none; font-weight:700;
    font-size:.85rem; padding:10px 20px; border-radius:12px;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <h1 id="title">呢個功能仲喺開發緊</h1>
    <p>做多幾份試卷之後就會用得到，敬請留意。</p>
    <a href="index.html">返去首頁</a>
  </div>
  <script>
    const names = {analysis:'錯題分析', notes:'筆記'};
    const f = new URLSearchParams(location.search).get('feature');
    if (names[f]) document.getElementById('title').textContent = names[f] + ' 仲喺開發緊';
  </script>
</body>
</html>
