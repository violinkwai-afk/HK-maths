<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小學習家</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{ --pink:#F5A9B8; --yellow:#FFF3C9; --bg:#FFF9FA; --white:#FFFFFF; --text:#26364D; --muted: rgba(38,54,77,0.55); --shadow: 0 2px 10px rgba(38,54,77,0.05); }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .box{max-width:340px; text-align:center;}
  .icon{width:48px; height:48px; border-radius:14px; background:var(--pink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
  h1{font-size:15px; margin:0 0 6px;}
  p{font-size:12.5px; color:var(--muted); line-height:1.6; margin:0 0 18px;}
  a{display:inline-block; background:var(--yellow); color:var(--text); text-decoration:none; font-weight:700;
    font-size:12.5px; padding:9px 18px; border-radius:12px;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text)"><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <h1 id="title">呢個功能仲喺開發緊</h1>
    <p>做多幾份試卷之後就會用得到，敬請留意。</p>
    <a href="index.html">返去首頁</a>
  </div>
  <script>
    const names = {analysis:'錯題分析', notes:'筆記'};
    const f = new URLSearchParams(location.search).get('feature');
    if (names[f]) document.getElementById('title').textContent = names[f] + ' 仲喺開發緊';
  </script>
</body>
</html>
