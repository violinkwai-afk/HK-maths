<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288;
    --pink:#f28ba0; --yellow-soft:#fdedc7;
    --shadow: 0 2px 10px rgba(58,43,46,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Chiron GoRound TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{max-width:340px; text-align:center;}
  .icon{width:56px; height:56px; border-radius:16px; background:var(--pink); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:var(--shadow);}
  h1{font-size:1.1rem; margin:0 0 8px; font-weight:800;}
  p{font-size:.85rem; color:var(--muted); line-height:1.6; margin:0 0 20px;}
  a{display:inline-block; background:var(--yellow-soft); color:var(--ink); text-decoration:none; font-weight:800;
    font-size:.85rem; padding:12px 22px; border-radius:16px; box-shadow:var(--shadow);}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <h1 id="title">這個功能仍在開發中</h1>
    <p>完成更多練習後將會開放，敬請留意。</p>
    <a href="index.html">返回首頁</a>
  </div>
  <script>
    const names = {analysis:'錯題分析', notes:'筆記'};
    const f = new URLSearchParams(location.search).get('feature');
    if (names[f]) document.getElementById('title').textContent = names[f] + ' 仍在開發中';
  </script>
</body>
</html>
