<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Card — Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&family=Short+Stack&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
    --shadow: 0 2px 10px rgba(58,43,46,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Chiron GoRound TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:430px; margin:0 auto; padding:20px 20px 40px;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; margin-bottom:20px;}
  h1{font-family:"Short Stack",cursive; font-size:1.8rem; margin:0 0 4px; font-weight:400; color:var(--pink-ink);}
  .sub{font-size:.85rem; color:var(--muted); margin:0 0 20px; line-height:1.55;}

  .picker{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .picker button{
    width:42px; height:42px; border-radius:50%; border:none; font-family:inherit;
    font-weight:800; font-size:1rem; background:var(--card); color:var(--ink);
    box-shadow:var(--shadow); cursor:pointer; transition:transform .15s ease;
  }
  .picker button.active{background:var(--pink); color:#ffffff; transform:scale(1.12);}

  .card{
    background:var(--card); border-radius:28px; padding:28px 20px; box-shadow:var(--shadow);
    text-align:center; cursor:pointer; user-select:none; position:relative; overflow:hidden;
    transition:transform .12s ease;
  }
  .card:active{transform:scale(0.97);}
  .card::before{
    content:""; position:absolute; top:-40px; right:-40px; width:120px; height:120px;
    border-radius:50%; background:var(--yellow-soft); z-index:0;
  }
  .frame{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:0 auto 20px; max-width:300px; position:relative; z-index:1;}
  .frame .cell{
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.08);
  }
  .frame .cell.a{background:var(--pink);}
  .frame .cell.b{background:var(--yellow);}

  .equation{font-size:1.7rem; font-weight:800; font-variant-numeric:tabular-nums; position:relative; z-index:1;}
  .equation .num-a{color:var(--pink-ink);}
  .equation .num-b{color:#a9761c;}
  .mascot{font-size:1.8rem; margin-top:8px; position:relative; z-index:1;}
  .hint{font-size:.75rem; color:var(--muted); margin-top:10px; position:relative; z-index:1;}

  .nav{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
  .nav button{
    background:var(--card); border:none; border-radius:14px; padding:12px 20px;
    font-family:inherit; font-weight:800; font-size:.85rem; color:var(--ink);
    box-shadow:var(--shadow); cursor:pointer;
  }
  .nav .progress{font-size:.8rem; color:var(--muted); font-weight:700;}

  @media (min-width: 760px){ .page{max-width:600px;} }
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回首頁
    </a>
    <h1>Flash Card</h1>
    <p class="sub">數的分成與合成 —— 選一個數字，輕觸卡片睇下一題。</p>

    <div class="picker" id="picker"></div>

    <div class="card" id="card">
      <div class="frame" id="frame"></div>
      <div class="equation" id="equation"></div>
      <div class="mascot" id="mascot">😊</div>
      <div class="hint">輕觸卡片，換下一題</div>
    </div>

    <div class="nav">
      <button id="prevBtn">‹ 上一題</button>
      <div class="progress" id="progress"></div>
      <button id="nextBtn">下一題 ›</button>
    </div>
  </div>

  <script>
    const picker = document.getElementById('picker');
    const frame = document.getElementById('frame');
    const equation = document.getElementById('equation');
    const mascot = document.getElementById('mascot');
    const card = document.getElementById('card');
    const progress = document.getElementById('progress');
    const faces = ['😊','🤗','😺','🌟','✨'];

    let target = 10;
    let splits = [];
    let index = 0;

    for (let n = 2; n <= 10; n++) {
      const btn = document.createElement('button');
      btn.textContent = n;
      btn.dataset.n = n;
      btn.addEventListener('click', () => selectTarget(n));
      picker.appendChild(btn);
    }

    function buildSplits(n) {
      const list = [];
      for (let a = 1; a <= Math.floor(n / 2); a++) list.push([a, n - a]);
      return list;
    }

    function selectTarget(n) {
      target = n;
      splits = buildSplits(n);
      index = 0;
      Array.from(picker.children).forEach(b => b.classList.toggle('active', Number(b.dataset.n) === n));
      render();
    }

    function render() {
      const [a, b] = splits[index];
      frame.innerHTML = Array.from({ length: target }, (_, i) =>
        `<div class="cell ${i < a ? 'a' : 'b'}"></div>`
      ).join('');
      equation.innerHTML = `${target} = <span class="num-a">${a}</span> + <span class="num-b">${b}</span>`;
      mascot.textContent = faces[Math.floor(Math.random() * faces.length)];
      progress.textContent = `${index + 1} / ${splits.length}`;
    }

    function advance(delta) {
      index = (index + delta + splits.length) % splits.length;
      render();
    }

    card.addEventListener('click', () => advance(1));
    document.getElementById('prevBtn').addEventListener('click', () => advance(-1));
    document.getElementById('nextBtn').addEventListener('click', () => advance(1));

    selectTarget(10);
  </script>
</body>
</html>
