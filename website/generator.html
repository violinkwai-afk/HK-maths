<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下載試卷 — 小小學習家</title>
<style>
  :root{
    --pink:#F5A9B8; --yellow:#FFF3C9; --bg:#FFF9FA; --card:#ffffff; --ink:#26364D; --muted:rgba(38,54,77,0.55); --border:rgba(38,54,77,0.08);
    --accent:#F5A9B8; --accent-ink:#26364D; --accent-soft:#FFF3C9;
    --line:#26364D;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-block:20px; padding-inline:16px;
  }
  .wrap{max-width:680px; margin:0 auto;}
  .back{display:inline-flex; align-items:center; gap:5px; color:var(--muted); text-decoration:none; font-size:12px; font-weight:600; margin-bottom:14px;}
  .back:hover{color:var(--ink);}
  h1.brand{
    font-size:18px; font-weight:700;
    text-align:center; margin:0 0 4px; color:var(--ink);
  }
  .tagline{text-align:center; color:var(--muted); font-size:12.5px; margin:0 0 18px;}

  .toolbar{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:18px; justify-content:center;}
  button{
    font-family:inherit; font-size:12.5px; font-weight:700; padding:10px 16px;
    border-radius:12px; border:none; cursor:pointer;
    transition:transform .12s ease; box-shadow:0 2px 10px rgba(38,54,77,0.05);
  }
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--pink); outline-offset:2px;}
  #genBtn{background:var(--pink); color:var(--ink);}
  #printBtn{background:var(--yellow); color:var(--ink);}
  #answerBtn{background:var(--card); color:var(--ink); border:1px solid var(--border);}

  .sheet{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:24px 20px; box-shadow:0 2px 10px rgba(38,54,77,0.05);
  }
  .paper-title{text-align:center; font-size:16px; font-weight:700; margin:0 0 2px;}
  .paper-sub{text-align:center; font-size:.78rem; color:var(--muted); margin-bottom:20px; letter-spacing:.03em;}
  .section-title{
    font-weight:700; font-size:1.05rem; margin:24px 0 14px; padding-bottom:6px;
    border-bottom:2px solid var(--line); text-wrap:balance;
  }
  .section-title:first-of-type{margin-top:0;}
  .q{margin-bottom:24px;}
  .q-text{font-size:1.25rem; margin-bottom:10px; line-height:1.4; font-variant-numeric:tabular-nums;}
  .q-num{font-weight:700; margin-right:4px; color:var(--accent-ink);}
  .ans-line{border-bottom:1.5px solid var(--line); width:170px; height:26px; display:inline-block;}
  .ans-line.wide{width:100%; max-width:420px; display:block;}
  .section2-grid{display:flex; flex-wrap:wrap; gap:24px 32px;}
  .section2-grid .q{display:flex; align-items:center; gap:10px;}
  .vertical-sum{font-size:1.25rem; font-family:"Courier New",monospace; width:140px; font-variant-numeric:tabular-nums;}
  .vertical-sum .row{display:flex; justify-content:flex-end; gap:6px;}
  .vertical-sum .box{display:inline-block; width:28px; height:28px; border:1.5px solid var(--line); border-radius:3px;}
  .vertical-sum .digit{display:inline-block; width:28px; text-align:center;}
  .vertical-sum .op{width:28px; text-align:center;}
  .vertical-sum .line{border-top:1.5px solid var(--line); margin:4px 0;}
  .vertical-sum .result{justify-content:flex-end; font-weight:700;}
  .footnote{
    margin-top:28px; font-size:.8rem; color:var(--muted); text-align:center;
    border-top:1px dashed var(--border); padding-top:14px;
  }

  #answerBox{
    display:none; margin-top:18px; padding:16px 18px; background:var(--accent-soft);
    border:1px solid var(--accent); border-radius:12px; font-size:.9rem; color:var(--ink);
  }
  #answerBox b{color:var(--accent-ink);}
  #answerBox ol{margin:10px 0 0; padding-left:20px; line-height:1.7;}

  @media print {
    body{background:#fff; padding:0;}
    .no-print{display:none;}
    .sheet{border:none; box-shadow:none; padding:0;}
  }
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<div class="wrap">
  <a class="back no-print" href="index.html">← 返去首頁</a>
  <h1 class="brand">下載試卷</h1>
  <p class="tagline">每次都係新一份練習，唔使登記。</p>

  <div class="toolbar no-print">
    <button id="genBtn">重新出卷</button>
    <button id="printBtn">列印 / 儲存做 PDF</button>
    <button id="answerBtn">答案key</button>
  </div>

  <div class="sheet" id="sheet"></div>
  <div id="answerBox"></div>
</div>

<script>
function randId(n){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let s = "";
  for(let i=0;i<n;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function genAddSub(){
  const op = Math.random()<0.5 ? "+" : "-";
  let a,b,answer,text;
  if(op==="+"){ a=randInt(10,69); b=randInt(10,99-a); answer=a+b; text=`${a} + ${b} =`; }
  else { a=randInt(20,99); b=randInt(10,a); answer=a-b; text=`${a} - ${b} =`; }
  return {type:"equation", text, answer:String(answer)};
}
function genMissingDigitSub(){
  const x=randInt(4,9), y=randInt(0,9);
  const top=x*10+8, sub=30+y, result=top-sub;
  if(result<10||result>98) return genMissingDigitSub();
  return {type:"missing_digit_sub", topOnes:8, subTens:3, result, text:`_8 - 3_ = ${result}`};
}
function genWordProblem(){
  const name = ["Tom","Mary","Peter","Ann"][randInt(0,3)];
  const kind = ["add_stickers","add_pencils","sub_sweets"][randInt(0,2)];
  let a,b,text,answer;
  if(kind==="add_stickers"){ a=randInt(20,60); b=randInt(10,40); text=`${name} has ${a} stickers. ${name} buys ${b} more stickers. How many stickers does ${name} have now?`; answer=a+b; }
  else if(kind==="add_pencils"){ a=randInt(20,60); b=randInt(10,40); text=`A shop sold ${a} pencils yesterday. It sold ${b} more pencils today. How many pencils were sold in total?`; answer=a+b; }
  else { a=randInt(30,70); b=randInt(10,a-5); text=`${name} has ${a} sweets. ${name} eats ${b} of them. How many sweets are left?`; answer=a-b; }
  return {type:"word_problem", text, answer:String(answer)};
}
function generateWorksheet(){
  const qs = [];
  for(let i=0;i<5;i++) qs.push(genAddSub());
  for(let i=0;i<2;i++) qs.push(genMissingDigitSub());
  qs.push(genWordProblem());
  return qs;
}

function renderSheet(worksheetId, questions){
  let n = 1;
  const s1 = [], s2 = [], s3 = [], answers = [];
  questions.forEach(q=>{
    if(q.type==="equation"){
      s1.push(`<div class="q"><div class="q-text"><span class="q-num">${n}.</span> ${q.text}</div><div class="ans-line"></div></div>`);
      answers.push(`${n}. ${q.text} <b>${q.answer}</b>`);
      n++;
    }
  });
  questions.forEach(q=>{
    if(q.type==="missing_digit_sub"){
      s2.push(`<div class="q"><div class="q-label"><span class="q-num">${n}.</span></div>
        <div class="vertical-sum">
          <div class="row"><span class="box"></span><span class="digit">${q.topOnes}</span></div>
          <div class="row"><span class="op">-</span><span class="digit">${q.subTens}</span><span class="box"></span></div>
          <div class="line"></div>
          <div class="row result">${String(q.result).padStart(2,'0')}</div>
        </div></div>`);
      answers.push(`${n}. ${q.text}`);
      n++;
    }
  });
  questions.forEach(q=>{
    if(q.type==="word_problem"){
      s3.push(`<div class="q wide"><div class="q-text"><span class="q-num">${n}.</span> ${q.text}</div><div class="ans-line wide"></div></div>`);
      answers.push(`${n}. <b>${q.answer}</b>`);
      n++;
    }
  });

  document.getElementById('sheet').innerHTML = `
    <div class="paper-title">Primary 1 Maths Practice</div>
    <div class="paper-sub">WORKSHEET ${worksheetId}</div>
    <div class="section-title">(1) Work out the answers.</div>
    <div class="section1">${s1.join('')}</div>
    <div class="section-title">(2) Fill in the missing digits.</div>
    <div class="section2-grid">${s2.join('')}</div>
    <div class="section-title">(3) Word problem.</div>
    <div class="section3">${s3.join('')}</div>
    <div class="footnote">Print this page, have your child complete it on paper, then use the answer key above to check their work.</div>
  `;
  document.getElementById('answerBox').innerHTML = `<b>Answer key — Worksheet ${worksheetId}</b><ol>${answers.map(a=>`<li>${a}</li>`).join('')}</ol>`;
}

function newWorksheet(){
  renderSheet(randId(6), generateWorksheet());
}

document.getElementById('genBtn').onclick = newWorksheet;
document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('answerBtn').onclick = () => {
  const box = document.getElementById('answerBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
};

newWorksheet();
</script>
</body>
</html>
