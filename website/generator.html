<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下載試卷 — 小小學習家</title>
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff; --border:rgba(58,43,46,0.08);
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
    --accent:#f28ba0; --accent-ink:#c23f5b; --accent-soft:#fbd9df;
    --line:#3a2b2e;
  }

  *{box-sizing:border-box;}
  body{
    color:var(--ink); margin:0;
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-block:20px; padding-inline:16px;
  }
  .wrap{max-width:680px; margin:0 auto;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; margin-bottom:16px;}
  .back:hover{color:var(--ink);}
  h1.brand{
    font-size:1.3rem; font-weight:800;
    text-align:center; margin:0 0 4px; color:var(--ink);
  }
  .tagline{text-align:center; color:var(--muted); font-size:.85rem; margin:0 0 20px;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; justify-content:center;}
  button{
    font-family:inherit; font-size:.85rem; font-weight:800; padding:11px 18px;
    border-radius:14px; border:none; cursor:pointer;
    transition:transform .12s ease; box-shadow:0 2px 10px rgba(58,43,46,0.06);
  }
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--pink); outline-offset:2px;}
  #genBtn{background:var(--pink); color:var(--ink);}
  #printBtn{background:var(--yellow); color:var(--ink);}
  #answerBtn{background:var(--card); color:var(--ink); border:1px solid var(--border);}

  .sheet{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:24px 20px; box-shadow:0 2px 10px rgba(58,43,46,0.06);
  }
  .paper-brand{text-align:center; font-family:"Short Stack",cursive; font-size:1.6rem; font-weight:400; color:var(--pink-ink); margin-bottom:6px; line-height:1;}
  .paper-brand .heart{color:var(--accent);}
  .paper-title{text-align:center; font-size:16px; font-weight:700; margin:0 0 2px;}
  .paper-sub{text-align:center; font-size:.68rem; color:var(--muted); margin-bottom:20px; letter-spacing:.02em; opacity:.7;}
  .paper-credit{font-size:.68rem; color:var(--muted); opacity:.6; margin-top:6px; letter-spacing:.01em;}
  .section-title{
    font-weight:700; font-size:1.05rem; margin:24px 0 14px; padding-bottom:6px;
    border-bottom:2px solid var(--line); text-wrap:balance;
  }
  .section-title:first-of-type{margin-top:0;}
  .section1{display:grid; grid-template-columns:1fr 1fr; gap:4px 28px;}
  .q{margin-bottom:24px;}
  .q-text{font-size:1.25rem; margin-bottom:10px; line-height:1.4; font-variant-numeric:tabular-nums;}
  .q-num{font-weight:700; margin-right:4px; color:var(--accent-ink);}
  .ans-line{border-bottom:1.5px solid var(--line); width:100%; max-width:170px; height:38px; display:block; position:relative;}
  .ans-line.wide{width:100%; max-width:420px; height:38px; display:block; position:relative;}
  .ans-line .ans-value{display:none; position:absolute; left:6px; bottom:4px; font-weight:700; color:var(--accent-ink);}
  .sheet.show-answers .ans-line .ans-value{display:inline-block;}
  .section2-grid{display:flex; flex-wrap:wrap; gap:24px 32px;}
  .section2-grid .q{display:flex; align-items:center; gap:10px;}
  .vertical-sum{font-size:1.25rem; font-family:"Courier New",monospace; width:160px; font-variant-numeric:tabular-nums;}
  .vertical-sum .row{display:flex; justify-content:flex-end; gap:6px;}
  .vertical-sum .box{display:inline-block; width:34px; height:34px; border:1.5px solid var(--line); border-radius:3px; position:relative;}
  .vertical-sum .box .ans-value{display:none; position:absolute; inset:0; text-align:center; line-height:31px; font-weight:700; color:var(--accent-ink);}
  .sheet.show-answers .vertical-sum .box .ans-value{display:block;}
  .vertical-sum .digit{display:inline-block; width:34px; text-align:center;}
  .vertical-sum .op{width:34px; text-align:center;}
  .vertical-sum .line{border-top:1.5px solid var(--line); margin:4px 0;}
  .vertical-sum .result{justify-content:flex-end; font-weight:700;}
  .footnote{
    margin-top:28px; font-size:.8rem; color:var(--muted); text-align:center;
    border-top:1px dashed var(--border); padding-top:14px;
  }
  .review-notice{
    background:var(--accent-soft); color:var(--accent-ink); border-radius:12px;
    padding:10px 14px; font-size:.8rem; line-height:1.5; margin-bottom:18px; text-align:center;
  }


  @media print {
    body{background:#fff; padding:0;}
    .no-print{display:none;}
    .sheet{border:none; box-shadow:none; padding:0;}
    .ans-value{display:none !important;}
  }
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Short+Stack&display=swap" rel="stylesheet">

<div class="wrap">
  <a class="back no-print" href="index.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    返回首頁
  </a>
  <h1 class="brand no-print">下載試卷</h1>
  <p class="tagline no-print">每次都是全新練習，無需登記。</p>

  <div class="toolbar no-print">
    <button id="genBtn">重新出卷</button>
    <button id="printBtn">列印 / 儲存為 PDF</button>
    <button id="answerBtn">查看答案</button>
  </div>

  <div class="sheet" id="sheet"></div>
</div>

<script>
function randId(n){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let s = "";
  for(let i=0;i<n;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function genAddSub(easy, forceOp){
  const op = forceOp || (Math.random()<0.5 ? "+" : "-");
  let a,b,answer,text;
  if(op==="+"){
    if(easy){ a=randInt(1,8); b=randInt(1,9-a); } // single-digit, sum stays under 10
    else { a=randInt(10,69); b=randInt(10,99-a); }
    answer=a+b; text=`${a} + ${b} =`;
  } else {
    if(easy){ a=randInt(5,9); b=randInt(1,a); } // single-digit, no borrowing
    else { a=randInt(20,99); b=randInt(10,a); }
    answer=a-b; text=`${a} - ${b} =`;
  }
  return {type:"equation", text, answer:String(answer)};
}
function genMissingDigitSub(){
  const x=randInt(4,9), y=randInt(0,9);
  const top=x*10+8, sub=30+y, result=top-sub;
  if(result<10||result>98) return genMissingDigitSub();
  // The rendered puzzle shows "_8 - 3_ = result" with the tens digit of the
  // top number (x) and the ones digit of the subtracted number (y) left
  // blank for the child to fill in. The answer key MUST state x and y
  // explicitly -- earlier this only repeated the puzzle pattern with
  // underscores, which tells a parent/grader nothing about what the
  // correct digits actually are.
  return {type:"missing_digit_sub", topTens:x, topOnes:8, subTens:3, subOnes:y, result,
    text:`${x}8 - 3${y} = ${result} (top blank = ${x}, bottom blank = ${y})`};
}
function genWordProblem(easy){
  const name = ["Tom","Mary","Peter","Ann"][randInt(0,3)];
  const kind = ["add_stickers","add_pencils","sub_sweets"][randInt(0,2)];
  let a,b,text,answer;
  if(easy){
    if(kind==="sub_sweets"){ a=randInt(5,9); b=randInt(1,a); text=`${name} has ${a} sweets. ${name} eats ${b} of them. How many sweets are left?`; answer=a-b; }
    else { a=randInt(2,5); b=randInt(2,9-a); text=`${name} has ${a} stickers. ${name} buys ${b} more stickers. How many stickers does ${name} have now?`; answer=a+b; }
    return {type:"word_problem", text, answer:String(answer)};
  }
  if(kind==="add_stickers"){ a=randInt(20,60); b=randInt(10,40); text=`${name} has ${a} stickers. ${name} buys ${b} more stickers. How many stickers does ${name} have now?`; answer=a+b; }
  else if(kind==="add_pencils"){ a=randInt(20,60); b=randInt(10,40); text=`A shop sold ${a} pencils yesterday. It sold ${b} more pencils today. How many pencils were sold in total?`; answer=a+b; }
  else { a=randInt(30,70); b=randInt(10,a-5); text=`${name} has ${a} sweets. ${name} eats ${b} of them. How many sweets are left?`; answer=a-b; }
  return {type:"word_problem", text, answer:String(answer)};
}

// weakTopics: array of 'add' | 'sub' | 'missing' | 'word' detected from the
// AI's free-text weak-area labels (see matchWeakTopics below) -- when
// present, the sheet is a shorter, deliberately easier set weighted toward
// those topics, meant as a foundation-first review before harder practice.
function generateWorksheet(weakTopics){
  const qs = [];
  if(weakTopics && weakTopics.length){
    const wantsAdd = weakTopics.includes('add'), wantsSub = weakTopics.includes('sub');
    for(let i=0;i<4;i++){
      const op = wantsAdd && wantsSub ? undefined : (wantsAdd ? '+' : wantsSub ? '-' : undefined);
      qs.push(genAddSub(true, op));
    }
    if(weakTopics.includes('missing')) for(let i=0;i<2;i++) qs.push(genMissingDigitSub());
    if(weakTopics.includes('word') || !weakTopics.includes('missing')) qs.push(genWordProblem(true));
    return qs;
  }
  for(let i=0;i<5;i++) qs.push(genAddSub());
  for(let i=0;i<2;i++) qs.push(genMissingDigitSub());
  qs.push(genWordProblem());
  return qs;
}

// Best-effort keyword match from the AI's free-text weak-area labels (e.g.
// "兩位數減法運算") to the handful of question types this generator actually
// has. Anything unrecognised (e.g. "長除法", which isn't implemented here)
// is simply dropped rather than guessed at.
function matchWeakTopics(weakAreasParam){
  const text = weakAreasParam || '';
  const topics = [];
  if(/加/.test(text)) topics.push('add');
  if(/減/.test(text)) topics.push('sub');
  if(/填空|直式|missing/i.test(text)) topics.push('missing');
  if(/應用題|word/i.test(text)) topics.push('word');
  return topics;
}

function renderSheet(worksheetId, questions, isReview){
  let n = 1;
  const s1 = [], s2 = [], s3 = [], answers = [];
  questions.forEach(q=>{
    if(q.type==="equation"){
      s1.push(`<div class="q"><div class="q-text"><span class="q-num">${n}.</span> ${q.text}</div><div class="ans-line"><span class="ans-value">${q.answer}</span></div></div>`);
      answers.push(`${q.text} <b>${q.answer}</b>`);
      n++;
    }
  });
  questions.forEach(q=>{
    if(q.type==="missing_digit_sub"){
      s2.push(`<div class="q"><div class="q-label"><span class="q-num">${n}.</span></div>
        <div class="vertical-sum">
          <div class="row"><span class="box"><span class="ans-value">${q.topTens}</span></span><span class="digit">${q.topOnes}</span></div>
          <div class="row"><span class="op">-</span><span class="digit">${q.subTens}</span><span class="box"><span class="ans-value">${q.subOnes}</span></span></div>
          <div class="line"></div>
          <div class="row result">${String(q.result).padStart(2,'0').split('').map(d=>`<span class="digit">${d}</span>`).join('')}</div>
        </div></div>`);
      answers.push(q.text);
      n++;
    }
  });
  questions.forEach(q=>{
    if(q.type==="word_problem"){
      s3.push(`<div class="q wide"><div class="q-text"><span class="q-num">${n}.</span> ${q.text}</div><div class="ans-line wide"><span class="ans-value">${q.answer}</span></div></div>`);
      answers.push(`<b>${q.answer}</b>`);
      n++;
    }
  });

  const reviewNotice = isReview ? `<div class="review-notice">重點溫習部份 — 題目特意調淺，等小朋友先掌握基礎，再逐步加深。</div>` : '';
  document.getElementById('sheet').innerHTML = `
    <div class="paper-brand">Little Steps <span class="heart">♥</span></div>
    <div class="paper-title">${isReview ? '重點溫習卷' : 'Primary 1 Maths Practice'}</div>
    <div class="paper-sub">WORKSHEET ${worksheetId}</div>
    ${reviewNotice}
    ${s1.length ? `<div class="section-title">(1) Work out the answers.</div><div class="section1">${s1.join('')}</div>` : ''}
    ${s2.length ? `<div class="section-title">(2) Fill in the missing digits.</div><div class="section2-grid">${s2.join('')}</div>` : ''}
    ${s3.length ? `<div class="section-title">(3) Word problem.</div><div class="section3">${s3.join('')}</div>` : ''}
    <div class="footnote">Print this page, have your child complete it on paper, then tap "查看答案" to check their work.
      <div class="paper-credit">Little Steps · hk-maths.violin-kwai.workers.dev · WORKSHEET ${worksheetId}</div>
    </div>
  `;

  // Save so upload.html (a separate page) can send it to the grading
  // endpoint -- worksheets are randomized client-side with no server-side
  // record, so this is the only copy of "what's actually correct" for
  // this specific worksheet instance.
  //
  // Kept as a BANK of recent worksheets, not just the latest one: a parent
  // who prints several in one sitting (common -- "print a few for the
  // week") then grades them later, out of order, needs each one's own
  // answer key recoverable by its printed ID, not just whichever was
  // generated most recently.
  try {
    const plainAnswers = answers.map(a => a.replace(/<[^>]+>/g, ''));
    localStorage.setItem('hk_maths_answer_key', JSON.stringify({
      worksheetId,
      answers: plainAnswers,
      savedAt: Date.now()
    }));
    const bankKey = 'hk_maths_worksheet_bank';
    const bank = JSON.parse(localStorage.getItem(bankKey) || '[]');
    bank.unshift({ worksheetId, answers: plainAnswers, savedAt: Date.now() });
    localStorage.setItem(bankKey, JSON.stringify(bank.slice(0, 15)));
  } catch (e) {}
}

const reviewTopics = matchWeakTopics(new URLSearchParams(location.search).get('review'));

function newWorksheet(){
  renderSheet(randId(6), generateWorksheet(reviewTopics), reviewTopics.length > 0);
  document.getElementById('answerBtn').textContent = '查看答案';
}

document.getElementById('genBtn').onclick = newWorksheet;
document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('answerBtn').onclick = () => {
  const sheet = document.getElementById('sheet');
  const btn = document.getElementById('answerBtn');
  const showing = sheet.classList.toggle('show-answers');
  btn.textContent = showing ? '隱藏答案' : '查看答案';
};

newWorksheet();
</script>
</body>
</html>
