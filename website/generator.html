<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1 Maths Worksheet Generator</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif; max-width:720px; margin:20px auto; color:#111; padding:0 16px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  button{font-size:1rem; padding:12px 18px; border-radius:10px; border:none; cursor:pointer; font-weight:700;}
  #genBtn{background:#2e9e93; color:#fff;}
  #printBtn{background:#2b3a67; color:#fff;}
  #answerBtn{background:#eee; color:#333;}
  .paper-title{text-align:center; font-size:1.3rem; font-weight:700; margin-bottom:2px;}
  .paper-sub{text-align:center; font-size:.8rem; color:#888; margin-bottom:18px;}
  .section-title{font-weight:700; font-size:1.15rem; margin:26px 0 12px; border-bottom:2px solid #333; padding-bottom:4px;}
  .q{margin-bottom:26px; page-break-inside:avoid;}
  .q-text{font-size:1.3rem; margin-bottom:10px;}
  .q-num{font-weight:700; margin-right:4px;}
  .ans-line{border-bottom:1px solid #333; width:180px; height:26px; display:inline-block;}
  .ans-line.wide{width:100%; max-width:420px; display:block;}
  .section2-grid{display:flex; flex-wrap:wrap; gap:28px;}
  .section2-grid .q{display:flex; align-items:center; gap:10px;}
  .vertical-sum{font-size:1.3rem; font-family:"Courier New",monospace; width:140px;}
  .vertical-sum .row{display:flex; justify-content:flex-end; gap:6px;}
  .vertical-sum .box{display:inline-block; width:28px; height:28px; border:1.5px solid #333;}
  .vertical-sum .digit{display:inline-block; width:28px; text-align:center;}
  .vertical-sum .op{width:28px; text-align:center;}
  .vertical-sum .line{border-top:1.5px solid #333; margin:4px 0;}
  .vertical-sum .result{justify-content:flex-end; font-weight:700;}
  .footnote{margin-top:30px; font-size:.75rem; color:#888; text-align:center; border-top:1px dashed #ccc; padding-top:10px;}
  #answerBox{display:none; margin-top:24px; padding:14px 16px; background:#fff8e1; border:1px solid #e6d68a; border-radius:10px; font-size:.9rem;}
  #answerBox ol{margin:8px 0 0; padding-left:20px;}
  @media print { .no-print{display:none;} }
</style>
</head>
<body>
  <div class="toolbar no-print">
    <button id="genBtn">🔄 Generate New Worksheet</button>
    <button id="printBtn">🖨️ Print / Save as PDF</button>
    <button id="answerBtn">🔑 Show Answer Key (for parent)</button>
  </div>

  <div id="sheet"></div>
  <div id="answerBox"></div>

<script>
function randId(n){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let s = "";
  for(let i=0;i<n;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function genAddSub(){
  const op = Math.random()<0.5 ? "+" : "-";
  let a,b,answer,text;
  if(op==="+"){ a=randInt(10,69); b=randInt(10,99-a); answer=a+b; text=`${a} + ${b} =`; }
  else { a=randInt(20,99); b=randInt(10,a); answer=a-b; text=`${a} - ${b} =`; }
  return {type:"equation", text, answer:String(answer)};
}
function genMissingDigitSub(){
  const x=randInt(4,9), y=randInt(0,9);
  const top=x*10+8, sub=30+y, result=top-sub;
  if(result<10||result>98) return genMissingDigitSub();
  return {type:"missing_digit_sub", topOnes:8, subTens:3, result, text:`_8 - 3_ = ${result}`};
}
function genWordProblem(){
  const name = ["Tom","Mary","Peter","Ann"][randInt(0,3)];
  const kind = ["add_stickers","add_pencils","sub_sweets"][randInt(0,2)];
  let a,b,text,answer;
  if(kind==="add_stickers"){ a=randInt(20,60); b=randInt(10,40); text=`${name} has ${a} stickers. ${name} buys ${b} more stickers. How many stickers does ${name} have now?`; answer=a+b; }
  else if(kind==="add_pencils"){ a=randInt(20,60); b=randInt(10,40); text=`A shop sold ${a} pencils yesterday. It sold ${b} more pencils today. How many pencils were sold in total?`; answer=a+b; }
  else { a=randInt(30,70); b=randInt(10,a-5); text=`${name} has ${a} sweets. ${name} eats ${b} of them. How many sweets are left?`; answer=a-b; }
  return {type:"word_problem", text, answer:String(answer)};
}
function generateWorksheet(){
  const qs = [];
  for(let i=0;i<5;i++) qs.push(genAddSub());
  for(let i=0;i<2;i++) qs.push(genMissingDigitSub());
  qs.push(genWordProblem());
  return qs;
}

function renderSheet(worksheetId, questions){
  let n = 1;
  const s1 = [], s2 = [], s3 = [], answers = [];
  questions.forEach(q=>{
    if(q.type==="equation"){
      s1.push(`<div class="q"><div class="q-text"><span class="q-num">${n}.</span> ${q.text}</div><div class="ans-line"></div></div>`);
      answers.push(`${n}. ${q.text} <b>${q.answer}</b>`);
      n++;
    }
  });
  questions.forEach(q=>{
    if(q.type==="missing_digit_sub"){
      s2.push(`<div class="q"><div class="q-label"><span class="q-num">${n}.</span></div>
        <div class="vertical-sum">
          <div class="row"><span class="box"></span><span class="digit">${q.topOnes}</span></div>
          <div class="row"><span class="op">-</span><span class="digit">${q.subTens}</span><span class="box"></span></div>
          <div class="line"></div>
          <div class="row result">${String(q.result).padStart(2,'0')}</div>
        </div></div>`);
      answers.push(`${n}. ${q.text}`);
      n++;
    }
  });
  questions.forEach(q=>{
    if(q.type==="word_problem"){
      s3.push(`<div class="q wide"><div class="q-text"><span class="q-num">${n}.</span> ${q.text}</div><div class="ans-line wide"></div></div>`);
      answers.push(`${n}. <b>${q.answer}</b>`);
      n++;
    }
  });

  document.getElementById('sheet').innerHTML = `
    <div class="paper-title">Primary 1 Maths Practice</div>
    <div class="paper-sub">Worksheet ID: ${worksheetId}</div>
    <div class="section-title">(1) Work out the answers.</div>
    <div class="section1">${s1.join('')}</div>
    <div class="section-title">(2) Fill in the missing digits.</div>
    <div class="section2-grid">${s2.join('')}</div>
    <div class="section-title">(3) Word problem.</div>
    <div class="section3">${s3.join('')}</div>
    <div class="footnote">Print this page, have your child complete it on paper, then keep the answer key (button above) to check their work.</div>
  `;
  document.getElementById('answerBox').innerHTML = `<b>Answer key (${worksheetId})</b><ol>${answers.map(a=>`<li>${a}</li>`).join('')}</ol>`;
}

function newWorksheet(){
  renderSheet(randId(6), generateWorksheet());
}

document.getElementById('genBtn').onclick = newWorksheet;
document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('answerBtn').onclick = () => {
  const box = document.getElementById('answerBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
};

newWorksheet();
</script>
</body>
</html>
