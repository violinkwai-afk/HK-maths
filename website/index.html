<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&family=Short+Stack&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Chiron GoRound TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:430px; margin:0 auto; padding:20px 20px 40px; position:relative;}

  .banner{position:absolute; top:0; left:0; width:100%; height:230px; z-index:0;}
  .header, .welcome, .cards, .section, .footnote{position:relative; z-index:1;}

  .header{display:flex; justify-content:space-between; align-items:flex-start; padding-top:4px;}
  .brand{font-family:"Short Stack",cursive; font-size:2rem; font-weight:400; color:var(--pink-ink); line-height:1.05;}
  .brand .heart{color:var(--pink);}
  .tagline{font-size:.85rem; color:var(--muted); margin-top:4px;}
  .mood{background:var(--card); border-radius:20px; padding:9px 15px; font-size:.85rem; font-weight:600; color:var(--ink); white-space:nowrap; display:flex; align-items:center; gap:6px;}

  .welcome{margin-top:26px;}
  .headline-row{display:flex; align-items:flex-start; justify-content:space-between;}
  .headline{font-size:1.8rem; font-weight:800; color:var(--ink); line-height:1.3;}
  .sun-wrap{position:relative; flex-shrink:0; width:140px; height:130px;}
  .subtext{font-size:.9rem; color:var(--muted); margin-top:8px; line-height:1.55;}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px;}
  .card{border-radius:22px; padding:20px 16px; position:relative; text-decoration:none; display:block;}
  .card1{background:var(--pink-soft);}
  .card2{background:var(--yellow-soft);}
  .card-icon{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .card1 .card-icon{background:var(--pink);}
  .card2 .card-icon{background:var(--yellow);}
  .card-title{font-size:1.1rem; font-weight:800; color:var(--ink);}
  .card-sub{font-size:.78rem; color:var(--muted); margin-top:2px;}
  .card-arrow{position:absolute; top:20px; right:16px; font-size:1.1rem; color:var(--muted);}

  .section{margin-top:28px;}
  .section-title{display:flex; align-items:center; gap:7px; font-size:1.05rem; font-weight:800; color:var(--ink);}
  .section-title .chev{margin-left:auto; color:var(--muted); font-weight:400;}

  .recent{background:var(--card); border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:12px; margin-top:12px; text-decoration:none;}
  .recent-icon{width:38px; height:38px; border-radius:10px; background:var(--pink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .recent-title{font-weight:700; font-size:.95rem; color:var(--ink);}
  .recent-sub{font-size:.75rem; color:var(--muted); margin-top:1px;}
  .pill{margin-left:auto; background:var(--pink-soft); color:var(--pink-ink); font-size:.75rem; font-weight:700; padding:7px 13px; border-radius:20px; white-space:nowrap;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  .gitem{background:var(--card); border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:10px; text-decoration:none;}
  .gitem-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .gitem:nth-child(1) .gitem-icon, .gitem:nth-child(3) .gitem-icon{background:var(--pink-soft);}
  .gitem:nth-child(2) .gitem-icon, .gitem:nth-child(4) .gitem-icon{background:var(--yellow-soft);}
  .gitem-title{font-weight:700; font-size:.9rem; color:var(--ink);}
  .gitem-sub{font-size:.7rem; color:var(--muted); margin-top:1px;}

  .footnote{text-align:center; font-size:.72rem; color:var(--muted); margin-top:26px; line-height:1.6;}

  @media (min-width: 760px){
    .page{max-width:820px;}
    .grid2{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>
  <div class="page">
    <svg class="banner" viewBox="0 0 430 230" preserveAspectRatio="none">
      <path d="M0,0 L430,0 L430,165 C 365,205 330,150 260,180 C 190,210 145,160 75,185 C 40,198 15,193 0,183 Z" fill="#fbdfe4"/>
    </svg>

    <div class="header">
      <div>
        <div class="brand">Little<br>Steps <span class="heart">♥</span></div>
        <div class="tagline">陪住小朋友 一步一步進步</div>
      </div>
      <div class="mood">今日好心情 <img src="assets/emoji/1F642.svg" width="18" height="18" alt=""></div>
    </div>

    <div class="welcome">
      <div class="headline-row">
        <div class="headline">準備好<br>開始了嗎？</div>
        <div class="sun-wrap">
          <svg width="140" height="130" viewBox="0 0 140 130">
            <!-- sun, peeking above the mountain peak -->
            <g>
              <circle cx="90" cy="38" r="22" fill="#f6c453"/>
              <g stroke="#f6c453" stroke-width="4" stroke-linecap="round">
                <line x1="90" y1="4" x2="90" y2="-4"/>
                <line x1="115.6" y1="12.4" x2="121.7" y2="6.3"/>
                <line x1="124" y1="38" x2="134" y2="38"/>
                <line x1="115.6" y1="63.6" x2="121.7" y2="69.7"/>
                <line x1="64.4" y1="63.6" x2="58.3" y2="69.7"/>
                <line x1="56" y1="38" x2="46" y2="38"/>
                <line x1="64.4" y1="12.4" x2="58.3" y2="6.3"/>
              </g>
              <circle cx="82" cy="35" r="2.6" fill="#3a2b2e"/>
              <circle cx="98" cy="35" r="2.6" fill="#3a2b2e"/>
              <path d="M79 45 Q90 53 101 45" stroke="#3a2b2e" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
            <!-- Mount Fuji, light blue base with white upper half -->
            <path d="M 20,120 L 68,50 L 116,120 Z" fill="#aee0f0"/>
            <path d="M 68,50 L 44,85 L 50,90 L 44,96 L 68,110 L 92,96 L 86,90 L 92,85 Z" fill="#ffffff"/>
            <!-- clouds, in front of the mountain -->
            <path d="M 8,108 Q -2,108 -2,98 Q -2,89 8,88 Q 9,79 20,79 Q 28,72 38,78 Q 47,74 52,83 Q 62,83 63,93 Q 66,95 66,101 Q 66,108 56,108 Z" fill="#ffffff"/>
            <path d="M 96,100 Q 88,100 88,92 Q 88,85 96,84 Q 97,77 106,77 Q 112,71 120,76 Q 127,73 131,80 Q 139,80 140,88 Q 142,90 142,95 Q 142,100 134,100 Z" fill="#ffffff"/>
          </svg>
        </div>
      </div>
      <div class="subtext">上載試卷 · 即時對答案 · 找出弱點 · 推介練習</div>
    </div>

    <div class="cards">
      <a class="card card1" href="upload.html">
        <div class="card-icon"><img src="assets/emoji/1F4F7.svg" width="24" height="24" alt=""></div>
        <div class="card-title">上載試卷</div>
        <div class="card-sub">拍照或選圖檔</div>
        <div class="card-arrow">›</div>
      </a>
      <a class="card card2" href="generator.html">
        <div class="card-icon"><img src="assets/emoji/1F4C4.svg" width="24" height="24" alt=""></div>
        <div class="card-title">下載試卷</div>
        <div class="card-sub">選擇科目 / 年級</div>
        <div class="card-arrow">›</div>
      </a>
    </div>

    <div class="section">
      <div class="section-title"><img src="assets/emoji/1F550.svg" width="20" height="20" alt=""> 最近使用<span class="chev">›</span></div>
      <div class="recent">
        <div class="recent-icon"><img src="assets/emoji/1F4DD.svg" width="22" height="22" alt=""></div>
        <div>
          <div class="recent-title">數學 · 小二</div>
          <div class="recent-sub">上次上載：3分鐘前</div>
        </div>
        <div class="pill">查看結果</div>
      </div>
    </div>

    <div class="section">
      <div class="grid2">
        <a class="gitem" href="coming-soon.html?feature=analysis">
          <div class="gitem-icon"><img src="assets/emoji/1F3AF.svg" width="20" height="20" alt=""></div>
          <div><div class="gitem-title">錯題分析</div><div class="gitem-sub">重點弱項 · 建議練習</div></div>
        </a>
        <a class="gitem" href="generator.html">
          <div class="gitem-icon"><img src="assets/emoji/1F4DA.svg" width="20" height="20" alt=""></div>
          <div><div class="gitem-title">練習題庫</div><div class="gitem-sub">按科目 · 按年級</div></div>
        </a>
        <a class="gitem" href="coming-soon.html?feature=notes">
          <div class="gitem-icon"><img src="assets/emoji/1F4CB.svg" width="20" height="20" alt=""></div>
          <div><div class="gitem-title">筆記</div><div class="gitem-sub">重點整理 · 自訂筆記</div></div>
        </a>
        <a class="gitem" href="#">
          <div class="gitem-icon"><img src="assets/emoji/1F3B4.svg" width="20" height="20" alt=""></div>
          <div><div class="gitem-title">Flash Card</div><div class="gitem-sub">輕點整理 · 隨時溫習</div></div>
        </a>
      </div>
    </div>

    <p class="footnote">呢個係獨立練習工具，同任何學校或教育局都冇關係。</p>
  </div>
</body>
</html>
