<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&family=Short+Stack&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Chiron GoRound TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:430px; margin:0 auto; padding:20px 20px 40px; position:relative;}

  .banner{position:absolute; top:0; left:0; width:100%; height:230px; z-index:0;}
  .header, .welcome, .cards, .section, .footnote{position:relative; z-index:1;}

  .header{display:flex; justify-content:space-between; align-items:flex-start; padding-top:4px;}
  .brand{font-family:"Short Stack",cursive; font-size:2rem; font-weight:400; color:var(--pink-ink); line-height:1.05;}
  .brand .heart{color:var(--pink);}
  .tagline{font-size:.85rem; color:var(--muted); margin-top:4px;}
  .mood{background:var(--card); border-radius:20px; padding:9px 15px; font-size:.85rem; font-weight:600; color:var(--ink); white-space:nowrap; display:flex; align-items:center; gap:6px;}

  .welcome{margin-top:20px;}
  .sun-wrap{position:absolute; top:46px; right:0; width:196px; height:133px; z-index:2; overflow:visible;}
  .feature-pills{display:flex; flex-wrap:wrap; gap:10px; max-width:220px;}
  .fpill{font-size:1rem; font-weight:800; padding:11px 16px; border-radius:16px; box-shadow:var(--shadow, 0 2px 10px rgba(58,43,46,0.06));}
  .fpill-pink{background:var(--pink-soft); color:var(--pink-ink);}
  .fpill-yellow{background:var(--yellow-soft); color:var(--ink);}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}
  .card{border-radius:22px; padding:20px 16px; position:relative; text-decoration:none; display:block;}
  .card1{background:var(--pink-soft);}
  .card2{background:var(--yellow-soft);}
  .card-icon{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; color:#ffffff;}
  .card1 .card-icon{background:var(--pink);}
  .card2 .card-icon{background:var(--yellow);}
  .card-title{font-size:1.1rem; font-weight:800; color:var(--ink);}
  .card-sub{font-size:.78rem; color:var(--muted); margin-top:2px;}
  .card-arrow{position:absolute; top:20px; right:16px; font-size:1.1rem; color:var(--muted);}

  .section{margin-top:20px;}
  .section-title{display:flex; align-items:center; gap:7px; font-size:1.05rem; font-weight:800; color:var(--ink);}
  .section-title .chev{margin-left:auto; color:var(--muted); font-weight:400;}

  .recent{background:var(--card); border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:12px; margin-top:20px; text-decoration:none;}
  .recent-icon{width:38px; height:38px; border-radius:10px; background:var(--pink); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#ffffff;}
  .recent-title{font-weight:700; font-size:.95rem; color:var(--ink);}
  .recent-sub{font-size:.75rem; color:var(--muted); margin-top:1px;}
  .pill{margin-left:auto; background:var(--pink-soft); color:var(--pink-ink); font-size:.75rem; font-weight:700; padding:7px 13px; border-radius:20px; white-space:nowrap;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}
  .gitem{background:var(--card); border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:10px; text-decoration:none;}
  .gitem-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#ffffff;}
  .gitem:nth-child(1) .gitem-icon, .gitem:nth-child(3) .gitem-icon{background:var(--pink);}
  .gitem:nth-child(2) .gitem-icon, .gitem:nth-child(4) .gitem-icon{background:var(--yellow);}
  .gitem-title{font-weight:700; font-size:.9rem; color:var(--ink);}
  .gitem-sub{font-size:.7rem; color:var(--muted); margin-top:1px;}

  .footnote{text-align:center; font-size:.72rem; color:var(--muted); margin-top:20px; line-height:1.6;}

  @media (min-width: 760px){
    .page{max-width:820px;}
    .grid2{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>
  <div class="page">
    <svg class="banner" viewBox="0 0 430 230" preserveAspectRatio="none">
      <path d="M0,0 L430,0 L430,165 C 365,205 330,150 260,180 C 190,210 145,160 75,185 C 40,198 15,193 0,183 Z" fill="#fbdfe4"/>
    </svg>

    <div class="header">
      <div>
        <div class="brand">Little<br>Steps <span class="heart">♥</span></div>
        <div class="tagline">陪伴孩子 一步一步進步</div>
      </div>
      <div class="mood">今日好心情 <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9" stroke-width="2.8"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke-width="0"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke-width="0"/><path d="M8.5 14.5c1 1 2.2 1.5 3.5 1.5s2.5-.5 3.5-1.5" stroke-width="2.8" stroke-linecap="round"/></svg></div>
    </div>

    <div class="sun-wrap">
      <svg width="100%" height="100%" viewBox="-110 0 280 190">
        <!-- Mount Fuji: flat top, trapezoid white snow cap (shifted further left) -->
        <path d="M -30,180 L 33,70 L 47,70 L 110,180 Z" fill="#aee0f0"/>
        <path d="M 33,70 L 47,70 L 72.8,115 L 7.2,115 Z" fill="#ffffff"/>
        <!-- clouds, well clear of the mountain, further left and higher -->
        <g transform="translate(-85,80) scale(1.35)" fill="#ffffff">
          <ellipse cx="0" cy="30" rx="40" ry="16"/>
          <circle cx="-20" cy="20" r="16"/>
          <circle cx="5" cy="12" r="20"/>
          <circle cx="28" cy="21" r="14"/>
        </g>
        <g transform="translate(-38,58) scale(1.05)" fill="#ffffff">
          <ellipse cx="0" cy="30" rx="40" ry="16"/>
          <circle cx="-20" cy="20" r="16"/>
          <circle cx="5" cy="12" r="20"/>
          <circle cx="28" cy="21" r="14"/>
        </g>
        <!-- sun, bigger, lower, shifted left -->
        <g>
          <circle cx="94" cy="55" r="34" fill="#f6c453"/>
          <g stroke="#f6c453" stroke-width="5.5" stroke-linecap="round">
            <line x1="94" y1="8.4" x2="94" y2="-4.2"/>
            <line x1="134.4" y1="17.4" x2="143.2" y2="8.5"/>
            <line x1="146.3" y1="55" x2="161.4" y2="55"/>
            <line x1="134.4" y1="92.6" x2="143.2" y2="101.5"/>
            <line x1="53.6" y1="92.6" x2="44.8" y2="101.5"/>
            <line x1="41.7" y1="55" x2="26.6" y2="55"/>
            <line x1="53.6" y1="17.4" x2="44.8" y2="8.5"/>
          </g>
          <circle cx="82.7" cy="50" r="4" fill="#3a2b2e"/>
          <circle cx="105.3" cy="50" r="4" fill="#3a2b2e"/>
          <path d="M77.6 63.8 Q94 75.1 110.4 63.8" stroke="#3a2b2e" stroke-width="4.3" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div class="welcome">
      <div class="feature-pills">
        <span class="fpill fpill-pink">上載試卷</span>
        <span class="fpill fpill-yellow">即時對答案</span>
        <span class="fpill fpill-pink">找出弱點</span>
        <span class="fpill fpill-yellow">推薦練習</span>
      </div>
    </div>

    <div class="cards">
      <a class="card card1" href="upload.html">
        <div class="card-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="2.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.2" stroke-width="2.8"/></svg></div>
        <div class="card-title">上載試卷</div>
        <div class="card-sub">拍照或選取圖片</div>
        <div class="card-arrow">›</div>
      </a>
      <a class="card card2" href="generator.html">
        <div class="card-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 3.5h7l3 3v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z" stroke-width="2.8" stroke-linejoin="round"/><path d="M14 3.5v3h3" stroke-width="2.8" stroke-linejoin="round"/></svg></div>
        <div class="card-title">下載試卷</div>
        <div class="card-sub">選擇科目 / 年級</div>
        <div class="card-arrow">›</div>
      </a>
    </div>

    <div class="section">
      <div class="section-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9" stroke-width="2.8"/><path d="M12 7v5l3.5 2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg> 最近使用<span class="chev">›</span></div>
      <div class="recent">
        <div class="recent-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 3.5h7l3 3v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z" stroke-width="2.8" stroke-linejoin="round"/><path d="M14 3.5v3h3" stroke-width="2.8" stroke-linejoin="round"/></svg></div>
        <div>
          <div class="recent-title">數學 · 小二</div>
          <div class="recent-sub">上次上載：3分鐘前</div>
        </div>
        <div class="pill">查看結果</div>
      </div>
    </div>

    <div class="section">
      <div class="grid2">
        <a class="gitem" href="analysis.html">
          <div class="gitem-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="7.5" stroke-width="2.8"/><circle cx="12" cy="12" r="3.8" stroke-width="2.8"/><circle cx="12" cy="12" r="0.9" fill="currentColor" stroke-width="0"/></svg></div>
          <div><div class="gitem-title">錯題分析</div><div class="gitem-sub">重點弱項 · 建議練習</div></div>
        </a>
        <a class="gitem" href="generator.html">
          <div class="gitem-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5c-.8 0-1.5-.7-1.5-1.5v-13z" stroke-width="2.8" stroke-linejoin="round"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5c.8 0 1.5-.7 1.5-1.5v-13z" stroke-width="2.8" stroke-linejoin="round"/></svg></div>
          <div><div class="gitem-title">練習題庫</div><div class="gitem-sub">按科目 · 按年級</div></div>
        </a>
        <a class="gitem" href="notes.html">
          <div class="gitem-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 4h9l4 4v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke-width="2.8" stroke-linejoin="round"/><path d="M14 4v4h4" stroke-width="2.8" stroke-linejoin="round"/><path d="M8 12h8M8 15.5h5.5" stroke-width="2.6" stroke-linecap="round"/></svg></div>
          <div><div class="gitem-title">筆記</div><div class="gitem-sub">重點整理 · 自訂筆記</div></div>
        </a>
        <a class="gitem" href="coming-soon.html?feature=flashcard">
          <div class="gitem-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="7" width="13" height="14" rx="2" stroke-width="2.8"/><path d="M9 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2" stroke-width="2.8"/></svg></div>
          <div><div class="gitem-title">Flash Card</div><div class="gitem-sub">輕點整理 · 隨時溫習</div></div>
        </a>
      </div>
    </div>

    <p class="footnote">這是一個獨立練習工具，與任何學校或教育局皆無關係。</p>
  </div>
</body>
</html>
