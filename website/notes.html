<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筆記 — Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
    --shadow: 0 2px 10px rgba(58,43,46,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:430px; margin:0 auto; padding:20px 20px 40px;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; margin-bottom:20px;}
  h1{font-size:1.3rem; margin:0 0 4px; font-weight:800;}
  .sub{font-size:.85rem; color:var(--muted); margin:0 0 20px; line-height:1.55;}

  .note-card{background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
  .note-label{font-size:.72rem; color:var(--pink-ink); font-weight:800; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;}
  .note-topic{font-weight:800; font-size:1rem; margin-bottom:10px;}
  .note-example-label{font-size:.72rem; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .note-example{background:var(--yellow-soft); border-radius:12px; padding:10px 12px; font-size:.88rem; line-height:1.5; font-variant-numeric:tabular-nums;}

  .empty{background:var(--card); border-radius:18px; padding:32px 20px; text-align:center; box-shadow:var(--shadow);}
  .empty-icon{width:52px; height:52px; border-radius:16px; background:var(--pink-soft); color:var(--pink-ink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
  .empty p{font-size:.85rem; color:var(--muted); line-height:1.6; margin:0 0 18px;}
  .empty a{display:inline-block; background:var(--pink); color:#ffffff; text-decoration:none; font-weight:800;
    font-size:.85rem; padding:12px 22px; border-radius:16px; box-shadow:var(--shadow);}

  @media (min-width: 760px){ .page{max-width:820px;} }
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回首頁
    </a>
    <h1>筆記</h1>
    <p class="sub">根據批改結果，整理小朋友要繼續學的內容。</p>

    <div id="content"></div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    let history = [];
    try {
      history = JSON.parse(localStorage.getItem('hk_maths_grading_history') || '[]');
    } catch (e) {}

    // One card per weak-area topic (not per wrong answer): the topic itself
    // is "what to keep learning", and a concrete example question from
    // whichever session first surfaced it makes the topic tangible instead
    // of an abstract label.
    const topics = new Map();
    history.forEach(h => {
      (h.weakAreas || []).forEach(topic => {
        if (topics.has(topic)) return;
        const wrongItem = (h.results || []).find(r => r.correct !== true);
        const idx = wrongItem ? Number(wrongItem.question) - 1 : -1;
        const example = (h.answerKeyLines && idx >= 0) ? h.answerKeyLines[idx] : null;
        topics.set(topic, example || null);
      });
    });

    const content = document.getElementById('content');

    if (!topics.size) {
      content.innerHTML = `
        <div class="empty">
          <div class="empty-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 4h8l4 4v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 11h6M9 15h6" stroke-width="2.4" stroke-linecap="round"/></svg>
          </div>
          <p>暫時未有筆記。<br>批改試卷後，小朋友需要加強的內容會自動整理到這裡。</p>
          <a href="upload.html">前往批改試卷</a>
        </div>
      `;
    } else {
      content.innerHTML = Array.from(topics.entries()).map(([topic, example]) => `
        <div class="note-card">
          <div class="note-label">要繼續學</div>
          <div class="note-topic">${escapeHtml(topic)}</div>
          ${example ? `
            <div class="note-example-label">題目例子</div>
            <div class="note-example">${escapeHtml(example)}</div>
          ` : ''}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
