<title>P1 Second-Term Maths Test</title>
<style>
  :root{ --bg:#faf7f0; --card:#ffffff; --ink:#2b2620; --muted:#8a8172; --border:#e8e1d2; --accent:#2e9e93; --accent-ink:#0b3d38; --accent-soft:#e3f4f1; --line:#3a332a; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1c1a16; --card:#26231d; --ink:#f0ece1; --muted:#a89f8d; --border:#3a352c; --accent:#5ec4b8; --accent-ink:#dff5f2; --accent-soft:#233631; --line:#e8e1d2; }
  }
  :root[data-theme="dark"]{ --bg:#1c1a16; --card:#26231d; --ink:#f0ece1; --muted:#a89f8d; --border:#3a352c; --accent:#5ec4b8; --accent-ink:#dff5f2; --accent-soft:#233631; --line:#e8e1d2; }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Arial,sans-serif; max-width:720px; margin:0 auto; padding-inline:16px; padding-block:24px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  button{font-family:inherit; font-size:.95rem; font-weight:700; padding:12px 18px; border-radius:10px; border:1px solid transparent; cursor:pointer;}
  #genBtn{background:var(--accent); color:#fff;}
  #printBtn{background:var(--ink); color:var(--bg);}
  #answerBtn{background:transparent; color:var(--ink); border-color:var(--border);}
  .sheet{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 20px;}
  .paper-title{text-align:center; font-size:1.05rem; font-weight:700; margin:0 0 2px;}
  .paper-sub2{text-align:center; font-size:.8rem; color:var(--muted); margin-bottom:3px;}
  .paper-sub{text-align:center; font-size:.72rem; color:var(--muted); margin-bottom:12px; letter-spacing:.02em;}
  .section-title{font-weight:700; font-size:.92rem; margin:16px 0 10px; padding-bottom:4px; border-bottom:2px solid var(--line);}
  .section-title:first-of-type{margin-top:0;}
  .section1-grid{display:grid; grid-template-columns:1fr 1fr; column-gap:18px;}
  .q{margin-bottom:12px;}
  .q-text{font-size:.98rem; margin-bottom:4px; line-height:1.35; font-variant-numeric:tabular-nums;}
  .q-num{font-weight:700; margin-right:3px; color:var(--accent-ink);}
  .ans-line{border-bottom:1.5px solid var(--line); width:90px; height:20px; display:inline-block;}
  .mc-opts{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; margin-top:6px; font-size:.92rem;}
  .vertical-sum{font-size:1.05rem; font-family:"Courier New",monospace; width:118px; font-variant-numeric:tabular-nums; display:inline-block; vertical-align:middle; margin-left:10px;}
  .vertical-sum .row{display:flex; justify-content:flex-end; gap:5px;}
  .vertical-sum .box{display:inline-block; width:22px; height:22px; border:1.5px solid var(--line); border-radius:3px;}
  .vertical-sum .digit{display:inline-block; width:22px; text-align:center;}
  .vertical-sum .op{width:22px; text-align:center;}
  .vertical-sum .line{border-top:1.5px solid var(--line); margin:3px 0;}
  .vertical-sum .result{justify-content:flex-end; font-weight:700;}
  .price-table{width:100%; border-collapse:collapse; margin:10px 0; font-size:.85rem;}
  .price-table th,.price-table td{border:1.5px solid var(--line); padding:6px; text-align:center;}
  .price-table img{width:40px; height:40px;}
  .price-table .price{font-weight:700;}
  .workbox{display:inline-block; border:1.5px solid var(--line); border-radius:6px; width:130px; height:70px; vertical-align:top; margin-left:10px; padding:5px; font-size:.7rem; color:var(--muted);}
  .footnote{margin-top:18px; font-size:.7rem; color:var(--muted); text-align:center; border-top:1px dashed var(--border); padding-top:10px;}
  #answerBox{display:none; margin-top:16px; padding:16px 18px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px; font-size:.88rem;}
  #answerBox ol{margin:8px 0 0; padding-left:20px; line-height:1.8;}
  @media print { .no-print{display:none;} .sheet{border:none; padding:0;} body{background:#fff;} }
</style>

<div class="toolbar no-print">
  <button id="genBtn">🔄 New test</button>
  <button id="printBtn">🖨️ Print / Save as PDF</button>
  <button id="answerBtn">🔑 Answer key</button>
</div>

<div class="sheet" id="sheet"></div>
<div id="answerBox"></div>

function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function build(){
  const ans = [];
  let n = 1;
  const rows1 = [];

  // Q1-Q2: two-digit + two-digit
  for(let i=0;i<2;i++){
    const a = ri(10,69), b = ri(10,99-a);
    rows1.push(row(n, `${a} + ${b} =`, `<span class="ans-line"></span>`));
    ans.push(`${n}. ${a} + ${b} = <b>${a+b}</b>`); n++;
  }
  // Q3: three-term addition
  {
    const a = ri(1,9), b = ri(10,40), c = ri(10,40);
    rows1.push(row(n, `${a} + ${b} + ${c} =`, `<span class="ans-line"></span>`));
    ans.push(`${n}. ${a} + ${b} + ${c} = <b>${a+b+c}</b>`); n++;
  }
  // Q4: two-digit subtraction
  {
    const a = ri(40,90), b = ri(10,a-1);
    rows1.push(row(n, `${a} - ${b} =`, `<span class="ans-line"></span>`));
    ans.push(`${n}. ${a} - ${b} = <b>${a-b}</b>`); n++;
  }
  // Q5: find the minuend, ___ - a = b
  {
    const a = ri(20,60), b = ri(5,30), missing = a+b;
    rows1.push(row(n, `<span class="ans-line"></span> - ${a} = ${b}`, ``));
    ans.push(`${n}. ___ - ${a} = ${b} &nbsp; missing number = <b>${missing}</b>`); n++;
  }

  // Q6: missing-digit subtraction column: _8 - 3_ = result
  const rows2 = [];
  {
    const x = ri(4,9), y = ri(0,9);
    const top = x*10+8, sub = 30+y, result = top-sub;
    rows2.push(`<div class="q"><span class="q-num">${n}.</span>
      <div class="vertical-sum">
        <div class="row"><span class="box"></span><span class="digit">8</span></div>
        <div class="row"><span class="op">-</span><span class="digit">3</span><span class="box"></span></div>
        <div class="line"></div>
        <div class="row result">${String(result).padStart(2,'0')}</div>
      </div></div>`);
    ans.push(`${n}. _8 - 3_ = ${result} &nbsp; top box = <b>${x}</b>, bottom box = <b>${y}</b>`); n++;
  }
  // Q7: missing-digit addition column: _8 + 3_ = RESULT  (mirrors Q6's subtraction puzzle
  // shape: top ones digit fixed at 8, addend tens digit fixed at 3, top TENS digit (x) and
  // addend ONES digit (y) are the two unknowns, result is fully shown). This has exactly
  // ONE solution for any generated result, because y is forced into [0,9] and x is then its
  // base-10 quotient -- unlike an earlier version that left both unknowns independent and
  // had many valid (x,y) pairs for the same result.
  {
    const x = ri(1,5), y = ri(0,9);
    const top = 10*x+8, addend = 30+y, result = top+addend;
    rows2.push(`<div class="q"><span class="q-num">${n}.</span>
      <div class="vertical-sum">
        <div class="row"><span class="box"></span><span class="digit">8</span></div>
        <div class="row"><span class="op">+</span><span class="digit">3</span><span class="box"></span></div>
        <div class="line"></div>
        <div class="row result">${result}</div>
      </div></div>`);
    ans.push(`${n}. _8 + 3_ = ${result} &nbsp; top box = <b>${x}</b>, bottom box = <b>${y}</b>`); n++;
  }

  // Q8: MCQ — which option has the same sum
  const mc1 = [];
  {
    const a = ri(20,49), b = ri(10,30), c = ri(10,30);
    const target = a+b+c;
    const correctText = `${a+1} + ${b+c-1}`;
    const opts = [
      {t:correctText, v:target},
      {t:`${a+2} + ${b+c}`, v:a+2+b+c},
      {t:`${b} + ${a}`, v:a+b},
      {t:`${a} + ${b-5>0?b-5:b}`, v:a+(b-5>0?b-5:b)},
    ];
    const letters = ['A','B','C','D'];
    const correctIdx = 0;
    ans.push(`${n}. Which sum equals "${a} + ${b} + ${c}" (=${target})? &nbsp; Answer: <b>${letters[correctIdx]}. ${opts[correctIdx].t}</b>`);
    mc1.push(`<div class="q"><div class="q-text"><span class="q-num">${n}.</span> Which of these has the same total as "${a} + ${b} + ${c}"?</div>
      <div class="mc-opts">${opts.map((o,i)=>`<div>${letters[i]}. ${o.t}</div>`).join('')}</div></div>`);
    n++;
  }
  // Q9: MCQ word problem
  {
    const oranges = ri(15,35), extra = ri(5,20);
    const apples = oranges+extra, total = oranges+apples;
    const opts = [extra, apples, oranges, total];
    // ensure distinct
    const letters = ['A','B','C','D'];
    ans.push(`${n}. A shop has ${oranges} oranges, and ${extra} more apples than oranges. How many oranges and apples in total? &nbsp; Answer: <b>D. ${total}</b>`);
    mc1.push(`<div class="q"><div class="q-text"><span class="q-num">${n}.</span> A fruit shop has ${oranges} oranges. It has ${extra} more apples than oranges. How many oranges and apples are there in total?</div>
      <div class="mc-opts"><div>A. ${opts[0]}</div><div>B. ${opts[1]}</div><div>C. ${opts[2]}</div><div>D. ${opts[3]}</div></div></div>`);
    n++;
  }

  // Q10-11: price table
  const robotPrice = ri(30,55), carPrice = ri(70,99), dollPrice = ri(15,29);
  const q10n = n, q11n = n+1;
  ans.push(`${q10n}. Robot ($${robotPrice}) + Doll ($${dollPrice}) = <b>$${robotPrice+dollPrice}</b>`);
  ans.push(`${q11n}. Car ($${carPrice}) - Robot ($${robotPrice}) = <b>$${carPrice-robotPrice}</b> more expensive`);
  n += 2;

  document.getElementById('sheet').innerHTML = `
    <div class="paper-title">Primary 1 Mathematics — Term 2 Test</div>
    <div class="paper-sub2">Name: ______________&nbsp;&nbsp;&nbsp; Class: ____ ( __ )&nbsp;&nbsp;&nbsp; Score: ____ / 13</div>
    <div class="paper-sub">TIME: 20 MINUTES</div>

    <div class="section-title">(1) Calculate the following. (10% @2%)</div>
    <div class="section1-grid">${rows1.join('')}</div>

    <div class="section-title">(2) Fill in the boxes to complete the vertical form. (4% @2%)</div>
    ${rows2.join('')}

    <div class="section-title">(3) Circle the correct answer. (4% @2%)</div>
    ${mc1.join('')}

    <div class="section-title">(4) Answer questions ${q10n}-${q11n} based on the price list. (4% @2%)</div>
    <table class="price-table">
      <tr><th></th><th>Robot</th><th>Car</th><th>Doll</th></tr>
      <tr><td>Item</td>
        <td><img src="${ROBOT_SVG}" alt="robot"></td>
        <td><img src="${CAR_SVG}" alt="car"></td>
        <td><img src="${DOLL_SVG}" alt="doll"></td>
      </tr>
      <tr><td>Price</td><td class="price">$${robotPrice}</td><td class="price">$${carPrice}</td><td class="price">$${dollPrice}</td></tr>
    </table>
    <div class="q"><div class="q-text"><span class="q-num">${q10n}.</span> Buying a robot and a doll together costs ( <span class="ans-line"></span> ) dollars in total.</div></div>
    <div class="q"><div class="q-text"><span class="q-num">${q11n}.</span> The car is ( <span class="ans-line"></span> ) dollars more expensive than the robot.</div></div>

    <div class="section-title">(5) Complete the following application questions. (8% @4%)</div>
    ${buildWordProblems(n, ans)}

    <div class="footnote">Take one clear photo of this whole page and send it back once done.</div>
  `;
  document.getElementById('answerBox').innerHTML = `<b>Answer key</b><ol>${ans.map(a=>`<li>${a}</li>`).join('')}</ol>`;
}

function buildWordProblems(startN, ans){
  let n = startN;
  const out = [];
  {
    const yesterday = ri(20,50), today = ri(15,40);
    out.push(`<div class="q"><div class="q-text"><span class="q-num">${n}.</span> A shop sold ${yesterday} pencils yesterday, and ${today} more pencils today. How many pencils were sold in these two days in total?</div>
      <span class="ans-line" style="width:220px;"></span> <span class="workbox">Working</span></div>`);
    ans.push(`${n}. ${yesterday} + ${today} = <b>${yesterday+today}</b>`); n++;
  }
  {
    const sweets = ri(40,70), candy = ri(10,35), choc = ri(10, sweets-5>35?35:sweets-5);
    out.push(`<div class="q"><div class="q-text"><span class="q-num">${n}.</span> Mum has ${sweets} sweets, ${candy} candies, and ${choc} chocolates. How many more sweets than chocolates does Mum have?</div>
      <span class="ans-line" style="width:220px;"></span> <span class="workbox">Working</span></div>`);
    ans.push(`${n}. ${sweets} - ${choc} = <b>${sweets-choc}</b>`); n++;
  }
  return out.join('');
}

function row(n, text, extra){
  return `<div class="q"><div class="q-text"><span class="q-num">${n}.</span> ${text} ${extra}</div></div>`;
}

document.getElementById('genBtn').onclick = build;
document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('answerBtn').onclick = () => {
  const box = document.getElementById('answerBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
};
build();
</script>
