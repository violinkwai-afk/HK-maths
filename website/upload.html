<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上載試卷 — Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
    --shadow: 0 2px 10px rgba(58,43,46,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Chiron GoRound TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:430px; margin:0 auto; padding:20px 20px 40px;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; margin-bottom:20px;}
  h1{font-size:1.3rem; margin:0 0 4px; font-weight:800;}
  .sub{font-size:.85rem; color:var(--muted); margin:0 0 20px; line-height:1.55;}
  .dropzone{
    background:var(--card); border:2px dashed var(--pink); border-radius:22px;
    box-shadow:var(--shadow); padding:32px 16px; text-align:center; cursor:pointer; display:block;
  }
  .dropzone-icon{width:56px; height:56px; border-radius:16px; background:var(--pink); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px;}
  .dropzone p{font-size:.95rem; font-weight:700; margin:0 0 4px;}
  .dropzone .hint{font-size:.75rem; color:var(--muted); font-weight:400;}
  input[type=file]{display:none;}
  .preview{margin-top:20px; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); display:none;}
  .preview img{display:block; width:100%;}
  .notice{
    margin-top:20px; background:var(--yellow-soft); color:var(--ink); border-radius:16px;
    padding:14px 16px; font-size:.85rem; line-height:1.6; display:none;
  }
  .submit-btn{
    width:100%; margin-top:20px; background:var(--pink); color:var(--ink); border:none;
    font-weight:800; font-size:.95rem; padding:14px; border-radius:16px; cursor:pointer; display:none;
    font-family:inherit; box-shadow:var(--shadow);
  }
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返去首頁
    </a>
    <h1>上載試卷</h1>
    <p class="sub">影低已經完成嘅試卷，或者揀返部機度嘅相片。</p>

    <label class="dropzone" id="dropzone">
      <div class="dropzone-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="2.4" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.2" stroke-width="2.4"/></svg>
      </div>
      <p>撳呢度影相 / 揀相片</p>
      <div class="hint">支援 JPG、PNG</div>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
    </label>

    <div class="preview" id="preview"><img id="previewImg" alt=""></div>
    <button class="submit-btn" id="submitBtn">提交批改</button>
    <div class="notice" id="notice"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const notice = document.getElementById('notice');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      previewImg.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      submitBtn.style.display = 'block';
      notice.style.display = 'none';
    });

    submitBtn.addEventListener('click', () => {
      notice.textContent = '已經收到你張相！自動改卷功能仲喺開發緊，暫時未可以即時對答案，唔好意思。';
      notice.style.display = 'block';
      submitBtn.style.display = 'none';
    });
  </script>
</body>
</html>
