<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上載試卷 — Little Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
    --shadow: 0 2px 10px rgba(58,43,46,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Chiron GoRound TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{max-width:430px; margin:0 auto; padding:20px 20px 40px;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; margin-bottom:20px;}
  h1{font-size:1.3rem; margin:0 0 4px; font-weight:800;}
  .sub{font-size:.85rem; color:var(--muted); margin:0 0 20px; line-height:1.55;}

  input[type=file]{display:none;}

  .capture-btn{
    width:100%; background:var(--pink); color:var(--ink); border:none;
    box-shadow:var(--shadow); border-radius:22px; padding:24px 16px; text-align:center;
    font-family:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .capture-btn:active{transform:translateY(1px);}
  .capture-icon{width:52px; height:52px; border-radius:16px; background:rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center;}
  .capture-btn .label{font-size:1rem; font-weight:800;}
  .capture-btn .hint{font-size:.75rem; font-weight:400; color:var(--ink); opacity:.75;}
  .gallery-link{display:block; text-align:center; margin-top:10px; font-size:.78rem; color:var(--muted); text-decoration:underline;}

  .pages{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px;}
  .page-thumb{position:relative; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); aspect-ratio:3/4; background:var(--card);}
  .page-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .page-thumb .num{position:absolute; top:4px; left:4px; background:rgba(58,43,46,.75); color:#fff;
    font-size:.65rem; font-weight:800; padding:2px 6px; border-radius:8px;}
  .page-thumb .del{position:absolute; top:4px; right:4px; background:rgba(255,255,255,.9); color:var(--pink-ink);
    font-size:.7rem; font-weight:800; width:20px; height:20px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .count-label{font-size:.78rem; color:var(--muted); margin-top:10px; text-align:center;}

  .notice{
    margin-top:20px; background:var(--yellow-soft); color:var(--ink); border-radius:16px;
    padding:14px 16px; font-size:.85rem; line-height:1.6; display:none;
  }
  .submit-btn{
    width:100%; margin-top:20px; background:var(--pink); color:var(--ink); border:none;
    font-weight:800; font-size:.95rem; padding:14px; border-radius:16px; cursor:pointer; display:none;
    font-family:inherit; box-shadow:var(--shadow);
  }
  .submit-btn:disabled{opacity:.6; cursor:default;}
  .answerkey-auto{
    margin-top:16px; display:none; align-items:center; justify-content:space-between;
    background:var(--pink-soft); color:var(--pink-ink); border-radius:14px;
    padding:10px 14px; font-size:.78rem; font-weight:700;
  }
  .answerkey-auto button{background:none; border:none; color:var(--pink-ink); text-decoration:underline;
    font-family:inherit; font-size:.78rem; font-weight:700; padding:0; cursor:pointer; box-shadow:none;}
  .answerkey-box{margin-top:16px; display:none;}
  .answerkey-box textarea{width:100%; min-height:70px; border-radius:14px; border:1px solid rgba(58,43,46,0.15);
    padding:10px 12px; font-family:inherit; font-size:.8rem; color:var(--ink); resize:vertical;}
  .answerkey-label{font-size:.75rem; color:var(--muted); margin:0 0 6px;}
  .result-card{margin-top:20px; background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; display:none;}
  .result-score{font-size:1.2rem; font-weight:800; margin-bottom:10px;}
  .result-item{display:flex; gap:8px; padding:8px 0; border-top:1px solid rgba(58,43,46,0.06); font-size:.82rem;}
  .result-item:first-of-type{border-top:none;}
  .result-mark{flex-shrink:0; font-weight:800;}
  .result-mark.ok{color:#2f9e5c;}
  .result-mark.no{color:#d9455f;}
  .result-mark.unsure{color:#a9821f;}
  .result-weak{margin-top:12px; padding-top:12px; border-top:1px solid rgba(58,43,46,0.06); font-size:.82rem;}
  .result-weak b{display:block; margin-bottom:4px;}
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回首頁
    </a>
    <h1>上載試卷</h1>
    <p class="sub">按一下拍攝一頁；試卷有多少頁，就按多少下，拍攝完畢後一併提交。</p>

    <button class="capture-btn" id="captureBtn" type="button">
      <div class="capture-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="2.4" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.2" stroke-width="2.4"/></svg>
      </div>
      <span class="label" id="captureLabel">拍攝第 1 頁</span>
      <span class="hint">按一下即開啟相機</span>
    </button>
    <a class="gallery-link" id="galleryLink">或從相簿選擇圖片</a>

    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <input type="file" id="galleryInput" accept="image/*" multiple>

    <div class="pages" id="pages"></div>
    <div class="count-label" id="countLabel"></div>

    <div class="answerkey-auto" id="answerkeyAuto">
      <span>✓ 已自動帶入這份試卷的答案key</span>
      <button type="button" id="answerkeyEditLink">編輯</button>
    </div>
    <div class="answerkey-box" id="answerkeyBox">
      <p class="answerkey-label">未能找到答案key，請貼上（於「下載試卷」頁按「查看答案」複製）</p>
      <textarea id="answerkeyInput" placeholder="例如：1. 43 + 26 = 69"></textarea>
    </div>

    <button class="submit-btn" id="submitBtn">提交批改</button>
    <div class="notice" id="notice"></div>
    <div class="result-card" id="resultCard"></div>
  </div>

  <script>
    const captureBtn = document.getElementById('captureBtn');
    const captureLabel = document.getElementById('captureLabel');
    const galleryLink = document.getElementById('galleryLink');
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const pagesEl = document.getElementById('pages');
    const countLabel = document.getElementById('countLabel');
    const submitBtn = document.getElementById('submitBtn');
    const notice = document.getElementById('notice');
    const answerkeyAuto = document.getElementById('answerkeyAuto');
    const answerkeyEditLink = document.getElementById('answerkeyEditLink');
    const answerkeyBox = document.getElementById('answerkeyBox');
    const answerkeyInput = document.getElementById('answerkeyInput');
    const resultCard = document.getElementById('resultCard');
    const MAX_PAGES = 5;
    let pageFiles = [];
    let hasAutoKey = false;
    let editingKey = false;

    try {
      const saved = JSON.parse(localStorage.getItem('hk_maths_answer_key') || 'null');
      if (saved && saved.answers && saved.answers.length) {
        answerkeyInput.value = saved.answers.join('\n');
        hasAutoKey = true;
      }
    } catch (e) {}

    answerkeyEditLink.addEventListener('click', () => {
      editingKey = true;
      refreshUI();
    });

    function refreshUI() {
      pagesEl.innerHTML = pageFiles.map((f, i) => `
        <div class="page-thumb">
          <span class="num">${i + 1}</span>
          <button class="del" data-i="${i}" type="button">✕</button>
          <img src="${URL.createObjectURL(f)}" alt="">
        </div>
      `).join('');
      const atLimit = pageFiles.length >= MAX_PAGES;
      captureBtn.style.display = atLimit ? 'none' : 'flex';
      galleryLink.style.display = atLimit ? 'none' : 'block';
      countLabel.textContent = pageFiles.length
        ? `已拍攝 ${pageFiles.length} 頁${atLimit ? `（每次最多 ${MAX_PAGES} 頁）` : ''}`
        : '';
      if (!atLimit) captureLabel.textContent = `拍攝第 ${pageFiles.length + 1} 頁`;
      const hasPages = pageFiles.length > 0;
      const showEditableBox = hasPages && (!hasAutoKey || editingKey);
      answerkeyAuto.style.display = (hasPages && hasAutoKey && !editingKey) ? 'flex' : 'none';
      answerkeyBox.style.display = showEditableBox ? 'block' : 'none';
      submitBtn.style.display = hasPages ? 'block' : 'none';
      notice.style.display = 'none';
      resultCard.style.display = 'none';
    }

    pagesEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.del');
      if (!btn) return;
      pageFiles.splice(Number(btn.dataset.i), 1);
      refreshUI();
    });

    captureBtn.addEventListener('click', () => cameraInput.click());
    galleryLink.addEventListener('click', () => galleryInput.click());

    cameraInput.addEventListener('change', () => {
      if (cameraInput.files[0] && pageFiles.length < MAX_PAGES) pageFiles.push(cameraInput.files[0]);
      cameraInput.value = '';
      refreshUI();
    });
    galleryInput.addEventListener('change', () => {
      const room = MAX_PAGES - pageFiles.length;
      pageFiles.push(...Array.from(galleryInput.files).slice(0, room));
      galleryInput.value = '';
      refreshUI();
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function saveToHistory(data) {
      try {
        const key = 'hk_maths_grading_history';
        const history = JSON.parse(localStorage.getItem(key) || '[]');
        history.unshift({
          date: Date.now(),
          score: data.score || '',
          weakAreas: Array.isArray(data.weakAreas) ? data.weakAreas : [],
          results: Array.isArray(data.results) ? data.results : [],
        });
        localStorage.setItem(key, JSON.stringify(history.slice(0, 30)));
      } catch (e) {}
    }

    function renderResult(data) {
      const marks = { true: ['✓','ok'], false: ['✗','no'], null: ['?','unsure'] };
      let html = `<div class="result-score">${escapeHtml(data.score || '')}</div>`;
      (data.results || []).forEach(r => {
        const key = r.correct === true ? 'true' : r.correct === false ? 'false' : 'null';
        const [sym, cls] = marks[key];
        html += `<div class="result-item"><span class="result-mark ${cls}">${sym}</span>
          <span><b>${escapeHtml(String(r.question || ''))}.</b> ${escapeHtml(r.studentAnswer || '')}
          ${r.note ? '<br><span style="color:var(--muted)">' + escapeHtml(r.note) + '</span>' : ''}</span></div>`;
      });
      if (data.weakAreas && data.weakAreas.length) {
        html += `<div class="result-weak"><b>弱項分析</b>${data.weakAreas.map(w => escapeHtml(w)).join('、')}</div>`;
      }
      resultCard.innerHTML = html;
      resultCard.style.display = 'block';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    submitBtn.addEventListener('click', async () => {
      if (!pageFiles.length) return;
      const answerKey = answerkeyInput.value.trim();
      if (!answerKey) {
        notice.textContent = '請先貼上答案key，才能準確批改。';
        notice.style.display = 'block';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = `正在批改 ${pageFiles.length} 頁，請稍候…`;
      notice.style.display = 'none';
      resultCard.style.display = 'none';

      try {
        const images = await Promise.all(pageFiles.map(async f => ({
          data: await fileToBase64(f),
          mediaType: f.type || 'image/jpeg',
        })));
        const res = await fetch('/api/grade', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ images, answerKey }),
        });
        const data = await res.json();
        if (!res.ok) {
          notice.textContent = data.message || '批改失敗，請稍後再試。';
          notice.style.display = 'block';
        } else {
          renderResult(data);
          saveToHistory(data);
        }
      } catch (e) {
        notice.textContent = '網絡錯誤，請檢查連線後再試一次。';
        notice.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交批改';
      }
    });

    refreshUI();
  </script>
</body>
</html>
