<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上載試卷 — 小小學習家</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --pink:#F5A9B8; --yellow:#FFF3C9; --bg:#FFF9FA; --white:#FFFFFF; --text:#26364D;
    --muted: rgba(38,54,77,0.55);
    --shadow: 0 2px 10px rgba(38,54,77,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;}
  .page{max-width:390px; margin:0 auto; padding:16px 20px 32px;}
  .back{display:inline-flex; align-items:center; gap:5px; color:var(--muted); text-decoration:none; font-size:12px; font-weight:600; margin-bottom:16px;}
  h1{font-size:18px; margin:0 0 4px;}
  .sub{font-size:12.5px; color:var(--muted); margin:0 0 18px; line-height:1.55;}
  .dropzone{
    background:var(--white); border:1.5px dashed var(--pink); border-radius:16px;
    box-shadow:var(--shadow); padding:26px 16px; text-align:center; cursor:pointer; display:block;
  }
  .dropzone svg{color:var(--text);}
  .dropzone p{font-size:13px; font-weight:700; margin:10px 0 3px;}
  .dropzone .hint{font-size:11px; color:var(--muted); font-weight:400;}
  input[type=file]{display:none;}
  .preview{margin-top:14px; border-radius:14px; overflow:hidden; box-shadow:var(--shadow); display:none;}
  .preview img{display:block; width:100%;}
  .notice{
    margin-top:16px; background:var(--yellow); color:var(--text); border-radius:13px;
    padding:12px 14px; font-size:12.5px; line-height:1.6; display:none;
  }
  .submit-btn{
    width:100%; margin-top:14px; background:var(--pink); color:var(--text); border:none;
    font-weight:700; font-size:13px; padding:12px; border-radius:13px; cursor:pointer; display:none;
    font-family:inherit;
  }
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">← 返去首頁</a>
    <h1>上載試卷</h1>
    <p class="sub">影低已經完成嘅試卷，或者揀返部機度嘅相片。</p>

    <label class="dropzone" id="dropzone">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.2" stroke-width="2"/></svg>
      <p>撳呢度影相 / 揀相片</p>
      <div class="hint">支援 JPG、PNG</div>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
    </label>

    <div class="preview" id="preview"><img id="previewImg" alt=""></div>
    <button class="submit-btn" id="submitBtn">提交批改</button>
    <div class="notice" id="notice"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const notice = document.getElementById('notice');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      previewImg.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      submitBtn.style.display = 'block';
      notice.style.display = 'none';
    });

    submitBtn.addEventListener('click', () => {
      notice.textContent = '已經收到你張相！自動改卷功能仲喺開發緊，暫時未可以即時對答案，唔好意思。';
      notice.style.display = 'block';
      submitBtn.style.display = 'none';
    });
  </script>
</body>
</html>
